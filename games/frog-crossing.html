<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>小青蛙过河</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Serif+SC:wght@500&family=ZCOOL+KuaiLe&display=swap">
<style>
  :root{
    --water-hi:#30b6a3;
    --water:#1f9187;
    --water-lo:#12665f;
    --pad:#74ca50;
    --pad-dark:#3d9434;
    --pad-deep:#2b7a4b;
    --ink:#15352b;
    --ink-soft:#4b6b60;
    --paper:#fffdf7;
    --paper-2:#edf7f0;
    --lotus:#ff6f9f;
    --lotus-deep:#c93c72;
    --lotus-soft:#ffe1eb;
    --sun:#ffc93c;
    --sun-deep:#d9960f;
    --coral:#e0533d;
    --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --f-han:"KaiTi","STKaiti","Kaiti SC","BiauKai","Noto Serif SC","Songti SC",serif;
    --f-py:"Andika","Trebuchet MS",system-ui,sans-serif;
    --f-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    --S:110px;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;background:var(--water);color:var(--ink);font-family:var(--f-ui);
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden;
  }
  body.playing{overflow:hidden}
  button{font:inherit;color:inherit;touch-action:manipulation}
  :focus-visible{outline:3px solid var(--sun);outline-offset:3px}

  /* ---------- 池塘 ---------- */
  #pond{position:fixed;inset:0;z-index:0;background-color:var(--water);transition:background-position .6s cubic-bezier(.4,.1,.3,1)}
  #rings{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .ring{position:absolute;width:96px;height:34px;margin:-17px 0 0 -48px;border-radius:50%;border:2px solid rgba(255,255,255,.34);animation:ring 2.8s ease-out forwards}
  @keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(1.7);opacity:0}}

  /* ---------- 首页 ---------- */
  #home{position:relative;z-index:1;max-width:780px;margin:0 auto;padding-inline:16px;padding-block:clamp(18px,4vh,40px) 48px;display:flex;flex-direction:column;gap:22px}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:#fff}
  .hero-frog{position:relative;width:150px;height:128px;border:0;background:none;padding:0;cursor:pointer;border-radius:24px}
  .hf-pad{position:absolute;left:0;bottom:-2px;width:150px;height:150px;transform:scaleY(.36);transform-origin:50% 100%}
  .hf-pad svg{width:100%;height:100%;filter:drop-shadow(0 8px 0 rgba(6,62,56,.3))}
  .hf-frog{position:absolute;left:20px;bottom:18px;width:110px;height:101px;transform-origin:50% 95%}
  .hf-frog svg{width:100%;height:100%;display:block;overflow:visible}
  .hero h1{
    font-family:var(--f-display);font-weight:400;font-size:clamp(42px,12vw,66px);margin:6px 0 0;
    letter-spacing:.06em;line-height:1.05;text-wrap:balance;
    text-shadow:0 4px 0 var(--water-lo),0 12px 26px rgba(0,40,40,.28);
  }
  .lede{margin:0;font-size:16px;line-height:1.65;opacity:.94;text-wrap:balance;max-width:28em}

  .sec-h{font-family:var(--f-display);font-weight:400;color:#fff;font-size:23px;margin:0 0 -8px;letter-spacing:.08em;display:flex;align-items:baseline;gap:10px}
  .sec-h small{font-family:var(--f-ui);font-size:13px;opacity:.8;letter-spacing:0}

  .decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (min-width:640px){.decks{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
  .deck{
    position:relative;aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);
    isolation:isolate;border-radius:50%;
  }
  .deck>.lp{position:absolute;inset:0;width:100%;height:100%;z-index:-1;transition:transform .45s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 6px 0 rgba(6,62,56,.32))}
  .deck:hover>.lp{transform:rotate(calc(var(--r) + 14deg)) scale(1.04)}
  .deck:active>.lp{transform:rotate(var(--r)) scale(.94)}
  .d-emo{font-family:var(--f-emoji);font-size:clamp(30px,9vw,42px);line-height:1}
  .d-name{font-family:var(--f-display);font-size:clamp(18px,5.2vw,22px);line-height:1.15}
  .d-prev{font-family:var(--f-han);font-size:15px;letter-spacing:.16em;color:var(--pad-deep);line-height:1.2}
  .d-meta{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.62);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;margin-top:2px}

  .mix{
    display:flex;align-items:center;gap:14px;width:100%;border:0;cursor:pointer;text-align:left;
    background:var(--paper);border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 rgba(6,62,56,.3);
  }
  .mix:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(6,62,56,.3)}
  .m-ico{width:54px;height:54px;flex:none}
  .m-ico svg{width:100%;height:100%}
  .m-t{font-family:var(--f-display);font-size:22px;line-height:1.2}
  .m-s{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .m-go{margin-left:auto;flex:none;font-family:var(--f-display);font-size:18px;background:var(--lotus);color:#fff;border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 var(--lotus-deep)}

  .card{background:var(--paper);border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 rgba(6,62,56,.25)}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--f-display);font-size:20px;margin-bottom:12px}
  .card-h b{font-family:var(--f-py);font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
  .stk{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--f-emoji);font-size:25px;background:var(--lotus-soft)}
  .stk.empty{background:none;border:2px dashed #cfe2d8}
  .stk-hint{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}

  details.parent summary{cursor:pointer;font-family:var(--f-display);font-size:19px;list-style:none;display:flex;align-items:center;justify-content:space-between;border-radius:10px}
  details.parent summary::-webkit-details-marker{display:none}
  details.parent summary::after{content:"＋";font-family:var(--f-ui);font-size:18px;color:var(--ink-soft)}
  details.parent[open] summary::after{content:"－"}
  .set{display:grid;gap:14px;margin-top:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .row>span{font-weight:700;font-size:14px}
  .seg{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .seg label{padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
  .seg input:checked+label{background:var(--pad-deep);color:#fff}
  .seg input:focus-visible+label{outline:3px solid var(--sun)}
  .note{font-size:13px;line-height:1.75;color:var(--ink-soft);margin:0}
  .note b{color:var(--ink)}
  .voice-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mini{border:0;cursor:pointer;background:var(--paper-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .danger{border:0;background:none;color:var(--coral);font-weight:700;font-size:13.5px;cursor:pointer;padding:4px 0;justify-self:start}

  /* ---------- 游戏 ---------- */
  #game{position:fixed;inset:0;z-index:2}
  .bar{
    position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;
  }
  .bar>*{pointer-events:auto}
  .roundbtn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,253,247,.94);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(6,62,56,.3)}
  .roundbtn svg{width:24px;height:24px}
  .steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
  .step{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.3);transition:transform .3s,background .3s}
  .step.done{background:var(--lotus);box-shadow:0 0 0 2px #fff}
  .step.now{background:#fff;transform:scale(1.25)}
  .score{display:flex;align-items:center;gap:5px;background:rgba(255,253,247,.94);border-radius:999px;padding:8px 14px 8px 9px;font-family:var(--f-py);font-weight:700;font-size:19px;box-shadow:0 3px 0 rgba(6,62,56,.3);font-variant-numeric:tabular-nums}
  .score svg{width:24px;height:24px}

  #stage{position:absolute;left:0;right:0;top:0;bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
  #world{position:absolute;inset:0}

  .prompt{
    position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 68px);left:50%;transform:translateX(-50%);
    width:min(calc(100% - 32px),440px);min-height:clamp(128px,21vh,168px);padding:12px 16px 10px;
    background:var(--paper);border-radius:24px;box-shadow:0 7px 0 rgba(6,62,56,.28),0 20px 40px rgba(4,50,45,.22);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  }
  #stage.side .prompt{left:16px;transform:none;width:min(34%,300px)}
  .p-main{display:flex;align-items:center;justify-content:center;gap:18px}
  .t-read .p-main{flex-direction:column;gap:2px}
  .p-emo{font-family:var(--f-emoji);font-size:clamp(54px,10vh,80px);line-height:1.08}
  .p-han{font-family:var(--f-han);font-weight:500;font-size:clamp(66px,12vh,100px);line-height:1}
  .p-han.two{font-size:clamp(54px,9.5vh,80px);letter-spacing:.05em}
  .p-py{font-family:var(--f-py);font-weight:700;font-size:22px;color:var(--lotus-deep)}
  .p-cap{font-family:var(--f-display);font-size:17px;color:var(--ink-soft);letter-spacing:.06em}
  .p-cap.oops{color:var(--coral)}
  .p-cap.good{color:var(--pad-deep)}
  .spk{
    width:62px;height:62px;flex:none;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
    background:var(--sun);box-shadow:0 4px 0 var(--sun-deep);
  }
  .spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
  .spk.big{width:98px;height:98px;box-shadow:0 6px 0 var(--sun-deep)}
  .spk.hint{width:48px;height:48px;margin-top:4px}
  .spk svg{width:56%;height:56%}
  .spk.talk .w1{animation:wv .5s ease-in-out infinite alternate}
  .spk.talk .w2{animation:wv .5s ease-in-out .15s infinite alternate}
  @keyframes wv{from{opacity:.25}to{opacity:1}}
  .rv{display:flex;align-items:center;justify-content:center;gap:14px;cursor:pointer;border-radius:16px}
  .rv-emo{font-family:var(--f-emoji);font-size:clamp(40px,7vh,56px);line-height:1}
  .rv-han{font-family:var(--f-han);font-weight:500;font-size:clamp(62px,11vh,92px);line-height:1}
  .rv-han.two{font-size:clamp(46px,8.5vh,70px)}
  .rv-side{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .rv-py{font-family:var(--f-py);font-weight:700;font-size:26px;color:var(--lotus-deep);white-space:nowrap}
  .rv-w{font-family:var(--f-han);font-size:24px}

  /* 荷叶 */
  .pad{
    position:absolute;left:0;top:0;width:var(--S);height:var(--S);padding:0;margin:0;border:0;background:none;border-radius:50%;
    cursor:pointer;z-index:2;transition:transform .6s cubic-bezier(.4,.1,.3,1),opacity .45s ease;-webkit-tap-highlight-color:transparent;
  }
  .pad.base{z-index:1;cursor:default;pointer-events:none}
  .pad .bob{position:absolute;inset:0;animation:bob 3.4s ease-in-out infinite}
  .pad .face{position:absolute;inset:0;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .3s,filter .3s}
  .lp{transform:rotate(var(--r,0deg))}
  .pad .lp{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 calc(var(--S) * .05) 0 rgba(6,62,56,.32))}
  .lp-leaf{fill:var(--pad);stroke:var(--pad-dark);stroke-width:2.5;stroke-linejoin:round}
  .lp-vein{fill:none;stroke:var(--pad-dark);stroke-width:1.6;stroke-linecap:round;opacity:.3}
  .lp-shine{fill:#fff;opacity:.15}
  .pad.choice:not(:disabled):hover .face{transform:scale(1.05)}
  .pad.choice:not(:disabled):active .face{transform:scale(.92)}
  .lab{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1;pointer-events:none}
  .lab.han{font-family:var(--f-han);font-weight:500;font-size:calc(var(--S) * .52);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .lab.han.two{font-size:calc(var(--S) * .3);letter-spacing:.02em}
  .lab small{font-family:var(--f-py);font-size:calc(var(--S) * .13);font-weight:700;color:var(--pad-deep);margin-top:.25em}
  .lab.emo{font-family:var(--f-emoji);font-size:calc(var(--S) * .46)}
  .pad.wrong .face{animation:nope .5s ease;transform:scale(.84);opacity:.45;filter:grayscale(.7)}
  .pad.gone .face{transform:scale(.5);opacity:0;transition:transform .5s ease-in,opacity .5s ease-in}
  .pad.hint .face::before{content:"";position:absolute;inset:-5%;border-radius:50%;border:calc(var(--S) * .045) solid var(--sun);animation:glow .8s ease-in-out infinite alternate}
  .pad.right .face{animation:yay .45s cubic-bezier(.3,1.6,.5,1)}
  .pad.lotus-home{pointer-events:none}
  .lotus-f{position:absolute;left:14%;top:12%;width:72%;height:72%;filter:drop-shadow(0 4px 0 rgba(150,40,80,.25))}
  .lo-1{fill:#ffb8d0;stroke:#f07aa3;stroke-width:1.5}
  .lo-2{fill:#ff80aa}
  .lo-c{fill:var(--sun)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(calc(var(--S) * -.03)) rotate(2deg)}}
  @keyframes nope{0%{transform:none;opacity:1;filter:none}20%{transform:translateX(-9%) rotate(-7deg)}40%{transform:translateX(8%) rotate(6deg)}60%{transform:translateX(-5%) rotate(-3deg)}100%{transform:scale(.84);opacity:.45;filter:grayscale(.7)}}
  @keyframes glow{from{transform:scale(.97);opacity:.55}to{transform:scale(1.07);opacity:1}}
  @keyframes yay{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* 青蛙 */
  #frog{position:absolute;left:0;top:0;width:calc(var(--S) * .8);height:calc(var(--S) * .8 * 110 / 120);z-index:4;pointer-events:none;transform-origin:50% 85%}
  #frog .fi,.hf-frog .fi{width:100%;height:100%;transform-origin:50% 95%;animation:breathe 2.6s ease-in-out infinite}
  #frog svg{display:block;width:100%;height:100%;overflow:visible}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
  #frog.sad .fi{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:none}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
  .m-sad{display:none}
  #frog.sad .m-sad{display:inline}
  #frog.sad .m-happy{display:none}
  .still .pad,.still #frog{transition:none!important}

  .splash{position:absolute;z-index:1;border-radius:50%;border:3px solid rgba(255,255,255,.7);pointer-events:none;animation:splash .7s ease-out forwards}
  @keyframes splash{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
  .plus{position:absolute;z-index:7;display:flex;align-items:center;gap:4px;font-family:var(--f-py);font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 var(--sun-deep);pointer-events:none;animation:plus 1.2s ease-out forwards}
  .plus svg{width:30px;height:30px}
  @keyframes plus{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}

  /* ---------- 结算 ---------- */
  .veil{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,58,54,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .sheet{
    width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:28px;padding:24px 20px 20px;text-align:center;
    box-shadow:0 10px 0 rgba(6,62,56,.3),0 30px 60px rgba(0,30,30,.35);animation:pop .5s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
  .w-title{font-family:var(--f-display);font-size:46px;color:var(--lotus-deep);line-height:1.1}
  .w-stars{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
  .w-stars span{display:block;width:50px;height:50px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .w-stars svg{width:100%;height:100%}
  .w-stars .off path{fill:#e3ebe7;stroke:#cdd9d3}
  .w-sub{font-size:15px;color:var(--ink-soft);margin-bottom:14px;font-variant-numeric:tabular-nums}
  .w-stk{display:inline-flex;align-items:center;gap:10px;background:var(--lotus-soft);border-radius:999px;padding:6px 18px 6px 8px;margin-bottom:16px}
  .w-stk .big{font-family:var(--f-emoji);font-size:42px;line-height:1;animation:spin 1s cubic-bezier(.3,1.5,.5,1) .5s both}
  @keyframes spin{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
  .w-stk span{font-family:var(--f-display);font-size:18px;color:var(--lotus-deep)}
  .w-lab{font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:10px}
  .w-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
  .chip{border:0;cursor:pointer;background:var(--paper-2);border-radius:14px;padding:6px 12px 5px;display:flex;flex-direction:column;align-items:center;min-width:58px}
  .chip b{font-family:var(--f-han);font-weight:500;font-size:30px;line-height:1.15}
  .chip b.two{font-size:24px}
  .chip i{font-style:normal;font-family:var(--f-py);font-size:13px;color:var(--lotus-deep);font-weight:700}
  .w-btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{flex:1 1 140px;border:0;cursor:pointer;border-radius:999px;padding:13px 18px;font-family:var(--f-display);font-size:22px}
  .btn.primary{background:var(--lotus);color:#fff;box-shadow:0 5px 0 var(--lotus-deep)}
  .btn.ghost{background:var(--paper-2);color:var(--ink);box-shadow:0 5px 0 #c6dbd0}
  .btn:active{transform:translateY(3px);box-shadow:none}

  #fx{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .petal{position:absolute;top:-30px;width:14px;height:18px;border-radius:70% 0 70% 0;animation:fall var(--d) linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}

  @media (prefers-reduced-motion:reduce){
    .bob,.fi{animation:none!important}
    .ring,.petal{display:none}
    #pond{transition:none}
  }
</style>

<div id="pond" aria-hidden="true"></div>
<div id="rings" aria-hidden="true"></div>

<main id="home">
  <header class="hero">
    <button class="hero-frog" id="heroFrog" type="button" aria-label="小青蛙，点我跳一跳">
      <span class="hf-pad" id="heroPad"></span>
      <span class="hf-frog" id="heroFrogSvg"></span>
    </button>
    <h1>小青蛙过河</h1>
    <p class="lede">听一听、看一看，跳上写对字的荷叶，送小青蛙回家。</p>
  </header>

function decorTile(flip) {

  zhVoice = zh.sort((a, b) => score(b) - score(a))[0] || null;
  updateVoiceNote();
}

    else speechSynthesis.speak(u);

  } catch (e) { return false; }
}

let actx = null;
function ac() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) try { actx = new C(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, d, v, type, to, delay) {
  if (!store.sfx) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + d + 0.05);
}

  $('#decks').innerHTML = DECKS.map((d, i) => {
    const known = d.items.filter(it => lvl(it) >= 2).length;
    const prev = d.id === 'words' ? d.items.slice(0, 2).map(it => it.c).join(' ') + '…' : d.items.slice(0, 4).map(it => it.c).join('') + '…';
    return `<button class="deck" type="button" data-deck="${d.id}" aria-label="${d.name}">${padSVG(DECK_ROT[i])}
      <span class="d-emo">${d.icon}</span><span class="d-name">${d.name}</span>
      <span class="d-prev">${prev}</span><span class="d-meta">认识 ${known}/${d.items.length}</span></button>`;
  }).join('');
  const seen = SINGLE.filter(it => it.c in store.m).length;
  $('#mixSub').textContent = seen >= 8 ? `从见过的 ${seen} 个字里出题` : '所有池塘的字混在一起考考你';
  const own = store.stickers;
  $('#stkCount').textContent = own.length + ' / ' + STICKERS.length;
  $('#stkGrid').innerHTML = STICKERS.map(s => own.includes(s) ? `<span class="stk">${s}</span>` : '<span class="stk empty"></span>').join('');
  $('#stkHint').hidden = own.length >= STICKERS.length;
  document.querySelectorAll('.seg input').forEach(inp => {
    const v = { py: store.py, voice: store.voice ? 'on' : 'off', rate: String(store.rate), sfx: store.sfx ? 'on' : 'off' }[inp.name];
    inp.checked = inp.value === v;
  });
}
$('#decks').addEventListener('click', e => { const b = e.target.closest('.deck'); if (b) startDeck(b.dataset.deck); });
$('#mixBtn').addEventListener('click', () => startDeck('mix'));
document.querySelectorAll('.seg input').forEach(inp => inp.addEventListener('change', () => {
  if (inp.name === 'py') store.py = inp.value;
  if (inp.name === 'voice') store.voice = inp.value === 'on';
  if (inp.name === 'rate') store.rate = parseFloat(inp.value);
  if (inp.name === 'sfx') store.sfx = inp.value === 'on';
  save();
}));
$('#testVoice').addEventListener('click', () => { if (!say('小青蛙，跳一跳！')) updateVoiceNote(); });
let resetArmed = 0;
$('#resetBtn').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!resetArmed) {
    b.textContent = '真的要清空吗？再点一次';
    resetArmed = setTimeout(() => { resetArmed = 0; b.textContent = '清空学习进度和贴纸'; }, 3500);
    return;
  }
  clearTimeout(resetArmed); resetArmed = 0;
  store.m = {}; store.stickers = []; save();
  b.textContent = '已清空';
  setTimeout(() => { b.textContent = '清空学习进度和贴纸'; }, 1800);
  renderHome();
});
$('#heroFrog').addEventListener('click', () => {
  const f = $('#heroFrogSvg');
  SFX.hop(); say('呱呱！');
  f.animate([{ transform: 'none' }, { transform: 'translateY(-46px) scale(1.08)' }, { transform: 'translateY(0) scale(1.1,.88)' }, { transform: 'none' }],
    { duration: 620, easing: 'ease-out' });
});

/* =========================== 游戏 =========================== */
const game = $('#game'), stage = $('#stage'), world = $('#world'), promptEl = $('#prompt');
const frog = document.createElement('div');
frog.id = 'frog';
frog.innerHTML = `<div class="fi">${FROG}</div>`;
let G = null, token = 0, L = { S: 110, cx: 0, rowY: 0, baseY: 0, gap: 120 }, wakeLock = null;

function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const side = W > H * 1.25 && H < 560;
  stage.classList.toggle('side', side);
  let top, cx, col;
  if (side) { const pr = promptEl.offsetLeft + promptEl.offsetWidth; top = 64; cx = (pr + W) / 2; col = Math.min(W - pr - 24, 560); }
  else { top = promptEl.offsetTop + promptEl.offsetHeight; cx = W / 2; col = Math.min(W - 16, 560); }
  let S = Math.min(col * 0.29, 150);
  S = Math.max(64, Math.min(S, (H - top - 20) / 2.45));
  const baseY = H - S * 0.58 - 10;
  const rowY = Math.min(baseY - S * 1.3, Math.max(top + S * 0.6 + 14, (top + baseY) / 2 - S * 0.1));
  L = { S, cx, rowY, baseY, gap: Math.min(col / 3, S * 1.14) };
  stage.style.setProperty('--S', S.toFixed(1) + 'px');
}
const slotX = i => L.cx + (i - 1) * L.gap;
const slotY = i => L.rowY + [0.07, -0.06, 0.07][i] * L.S;
function place(el, x, y) { el._x = x; el._y = y; el.style.transform = `translate(${(x - L.S / 2).toFixed(1)}px,${(y - L.S / 2).toFixed(1)}px)`; }
function placeInstant(el, x, y) { el.style.transition = 'none'; place(el, x, y); el.getBoundingClientRect(); el.style.transition = ''; }
function frogPos(x, y) { const F = L.S * 0.8, Fh = F * 110 / 120; return [x - F / 2, y - Fh * 0.8]; }
function setFrog(x, y) { G.fx = x; G.fy = y; const [a, b] = frogPos(x, y); frog.style.transform = `translate(${a.toFixed(1)}px,${b.toFixed(1)}px)`; }

function makePad(o, kind, pic) {
  const el = document.createElement(kind === 'choice' ? 'button' : 'div');
  el.className = 'pad ' + kind;
  if (kind === 'choice') el.type = 'button';
  let lab = '';
  if (o) {
    lab = pic ? `<span class="lab emo">${o.e}</span>`
              : `<span class="lab han${o.c.length > 1 ? ' two' : ''}">${o.c}${store.py === 'always' && o.p ? `<small>${o.p}</small>` : ''}</span>`;
    el.setAttribute('aria-label', pic ? o.e : o.c);
  }
  el.innerHTML = `<span class="bob" style="animation-delay:${(-Math.random() * 3).toFixed(2)}s"><span class="face">${padSVG(Math.round(Math.random() * 360))}${lab}</span></span>`;
  el._o = o;
  return el;
}

function mixPool() {
  const seen = SINGLE.filter(it => it.c in store.m);
  return seen.length >= 8 ? seen : SINGLE;
}
function buildQueue(pool) {
  const byLvl = shuffle(pool.slice()).sort((a, b) => lvl(a) - lvl(b));
  let q;
  if (byLvl.length <= ROUND) {
    q = byLvl.slice();
    while (q.length < ROUND) q.push(pick(byLvl));
  } else {
    q = byLvl.slice(0, 6).concat(shuffle(byLvl.slice(6)).slice(0, ROUND - 6));   // 6 个最生的 + 2 个复习
  }
  for (let t = 0; t < 30; t++) {
    shuffle(q);
    if (q.every((it, i) => i === 0 || it !== q[i - 1])) break;
  }
  return q;
}
function pickType(it) {
  const m = lvl(it);
  let t = m <= 0 ? 'picSound' : m === 1 ? (Math.random() < 0.5 ? 'sound' : 'read') : (Math.random() < 0.65 ? 'read' : 'sound');
  if (!canSpeak() && (t === 'picSound' || t === 'sound')) t = 'pic';
  return t;
}
function distractors(it, type) {
  const out = [], usedC = new Set([it.c]), usedE = new Set([it.e]);
  if (type === 'sound' && lvl(it) >= 2 && LOOK[it.c]) {
    const lk = pick([...LOOK[it.c]]);
    out.push({ c: lk, p: '', e: '', fake: true }); usedC.add(lk);
  }
  for (const d of shuffle(G.pool.slice())) {
    if (out.length >= 2) break;
    if (usedC.has(d.c) || usedE.has(d.e)) continue;
    out.push(d); usedC.add(d.c); usedE.add(d.e);
  }
  return out;
}

function startDeck(id) {
  const deck = id === 'mix' ? { id: 'mix', name: '大挑战' } : DECKS.find(d => d.id === id);
  const pool = id === 'mix' ? mixPool() : deck.items;
  token++;
  G = { tk: token, deck, pool, queue: [], idx: 0, stars: 0, learned: [], busy: true, pads: [], base: null, fx: 0, fy: 0, q: null };
  G.queue = buildQueue(pool);
  say('出发！');                       // 在点击里先说一句，iOS 才肯放后面的朗读
  $('#win').hidden = true;
  $('#home').hidden = true;
  game.hidden = false;
  document.body.classList.add('playing');
  world.innerHTML = '';
  world.appendChild(frog);
  promptEl.className = 'prompt'; promptEl.innerHTML = '';
  $('#starN').textContent = '0';
  renderSteps();
  layout();
  const base = makePad(null, 'base');
  world.insertBefore(base, frog);
  placeInstant(base, L.cx, L.baseY);
  G.base = base;
  frog.style.transition = 'none';
  setFrog(L.cx, L.baseY);
  requestWake();
  nextQuestion(true);
}

function nextQuestion(first) {
  const it = G.queue[G.idx], type = pickType(it);
  G.q = { it, type, opts: shuffle([it, ...distractors(it, type)]), wrong: 0 };
  renderPrompt();
  renderSteps();
  spawnPads();
  G.busy = false;
  if (type === 'picSound' || type === 'sound') {
    const q = G.q;
    setTimeout(() => { if (G && G.q === q && !G.busy) speakPrompt(); }, first ? 900 : 380);
  }
}
function speakPrompt() {
  if (!G || !G.q) return;
  say(G.q.it.c);
  const b = promptEl.querySelector('.spk');
  if (b) { b.classList.add('talk'); setTimeout(() => b.classList.remove('talk'), 1000); }
}
const spk = cls => `<button type="button" class="spk ${cls}" data-say="one" aria-label="再听一遍">${SPEAKER}</button>`;
function renderPrompt() {
  const { it, type } = G.q, two = it.c.length > 1 ? ' two' : '';
  let main, cap;
  if (type === 'picSound')  { main = `<span class="p-emo">${it.e}</span>${spk('')}`; cap = '听一听，找出这个字'; }
  else if (type === 'sound'){ main = spk('big'); cap = '听一听，跳上哪片荷叶？'; }
  else if (type === 'pic')  { main = `<span class="p-emo">${it.e}</span>`; cap = '看一看，哪个字是它？'; }
  else { main = `<span class="p-han${two}">${it.c}</span>` + (store.py === 'always' ? `<span class="p-py">${it.p}</span>` : ''); cap = '读一读，它是哪个？'; }
  promptEl.className = 'prompt t-' + type;
  promptEl.innerHTML = `<div class="p-main">${main}</div><div class="p-cap" id="pCap">${cap}</div>`;
}
function reveal(first) {
  const it = G.q.it, py = store.py !== 'never';
  promptEl.className = 'prompt t-reveal';
  promptEl.innerHTML = `<div class="rv" data-say="full" role="button" tabindex="0" aria-label="再读一遍">
    <span class="rv-emo">${it.e}</span><span class="rv-han${it.c.length > 1 ? ' two' : ''}">${it.c}</span>
    <span class="rv-side">${py ? `<span class="rv-py">${it.p}</span>` : ''}${it.w ? `<span class="rv-w">${it.w}</span>` : ''}</span></div>
    <div class="p-cap good">${first ? pick(PRAISE) : '找到啦！'}</div>`;
}
promptEl.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (!b || !G || !G.q) return;
  if (b.dataset.say === 'full') sayFull(G.q.it); else speakPrompt();
});

function spawnPads() {
  const { opts, type } = G.q;
  G.pads = opts.map((o, i) => {
    const b = makePad(o, 'choice', type === 'read');
    b.dataset.slot = i;
    b.style.opacity = '0';
    world.insertBefore(b, frog);
    placeInstant(b, slotX(i), slotY(i) - L.S * 0.7);
    setTimeout(() => { if (b.isConnected) { place(b, slotX(i), slotY(i)); b.style.opacity = ''; } }, 40 + i * 90);
    b.addEventListener('click', () => choose(b));
    return b;
  });
}
function choose(b) {
  if (!G || G.busy || b.disabled || !G.q) return;
  if (b._o === G.q.it) onRight(b); else onWrong(b);
}
function onWrong(b) {
  const q = G.q;
  b.disabled = true; b.classList.add('wrong');
  SFX.no();
  q.wrong++;
  if (q.wrong === 1) bump(q.it, -1);
  frog.classList.remove('sad'); void frog.offsetWidth; frog.classList.add('sad');
  setTimeout(() => frog.classList.remove('sad'), 900);
  const cap = $('#pCap');
  if (cap) { cap.textContent = '没关系，再试一次！'; cap.classList.add('oops'); }
  if (q.type === 'sound' || q.type === 'picSound') setTimeout(() => { if (G && G.q === q && !G.busy) speakPrompt(); }, 550);
  if ((q.type === 'read' || q.type === 'pic') && canSpeak() && !promptEl.querySelector('.spk')) {
    promptEl.querySelector('.p-main').insertAdjacentHTML('beforeend', spk('hint'));   // 读不出来？给个声音提示
  }
  const left = G.pads.filter(p => !p.disabled);
  if (q.wrong >= 2 || left.length === 1) left.forEach(p => { if (p._o === q.it) p.classList.add('hint'); });
}
async function onRight(b) {
  const q = G.q, tk = G.tk, first = q.wrong === 0;
  G.busy = true;
  if (first) { G.stars++; bump(q.it, 1); }
  if (!G.learned.includes(q.it)) G.learned.push(q.it);
  SFX.yes();
  b.classList.remove('hint'); b.classList.add('right');
  G.pads.forEach(p => { p.disabled = true; if (p !== b) p.classList.add('gone'); });
  await hop(b._x, b._y);
  if (!G || G.tk !== tk) return;
  splashAt(b._x, b._y);
  reveal(first);
  sayFull(q.it);
  if (first) { plusStar(b._x, b._y - L.S * 0.95); $('#starN').textContent = G.stars; }
  G.idx++;
  renderSteps();
  await wait(420);
  if (!G || G.tk !== tk) return;
  await scrollWorld(b);
  if (!G || G.tk !== tk) return;
  if (G.idx >= ROUND) { finish(); return; }
  await wait(950);
  if (!G || G.tk !== tk) return;
  nextQuestion(false);
}

function hop(x, y) {
  SFX.hop();
  const [a0, b0] = frogPos(G.fx, G.fy), [a1, b1] = frogPos(x, y);
  const h = Math.max(L.S * 0.7, Math.abs(b1 - b0) * 0.45), kf = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14, s = 1 + 0.3 * Math.sin(Math.PI * t);
    kf.push({ transform: `translate(${a0 + (a1 - a0) * t}px,${b0 + (b1 - b0) * t - h * Math.sin(Math.PI * t)}px) scale(${s})` });
  }
  kf[0].transform = `translate(${a0}px,${b0}px) scale(1.08,.88)`;
  frog.style.transition = 'none';
  setFrog(x, y);
  if (!frog.animate) return Promise.resolve();
  return frog.animate(kf, { duration: 560, easing: 'cubic-bezier(.3,0,.4,1)' }).finished.catch(() => {}).then(() => {
    frog.animate([{ transform: `translate(${a1}px,${b1}px) scale(1.12,.86)` }, { transform: `translate(${a1}px,${b1}px) scale(1)` }], { duration: 240, easing: 'ease-out' });
  });
}
function scrollWorld(b) {
  const dy = L.baseY - b._y, old = G.base;
  b.classList.remove('choice', 'right');
  b.classList.add('base');
  G.base = b;
  frog.style.transition = 'transform .6s cubic-bezier(.4,.1,.3,1)';
  place(b, L.cx, L.baseY);
  setFrog(L.cx, L.baseY);
  if (old) { place(old, old._x, old._y + dy + L.S * 0.3); old.style.opacity = '0'; }
  const gone = G.pads.filter(p => p !== b);
  gone.forEach(p => place(p, p._x, p._y + dy));
  G.pads = [];
  setPond(pondY + dy);
  return wait(620).then(() => { frog.style.transition = ''; if (old) old.remove(); gone.forEach(p => p.remove()); });
}
async function finish() {
  const tk = G.tk;
  const home = document.createElement('div');
  home.className = 'pad lotus-home';
  home.innerHTML = `<span class="bob"><span class="face">${padSVG(30)}${lotusSVG()}</span></span>`;
  home.style.opacity = '0';
  world.insertBefore(home, frog);
  placeInstant(home, L.cx, L.rowY - L.S * 0.8);
  await wait(40);
  place(home, L.cx, L.rowY); home.style.opacity = '';
  promptEl.className = 'prompt t-reveal';
  promptEl.innerHTML = `<div class="p-main">${lotusSVG('m-lotus', 84)}</div><div class="p-cap good">跳上荷花，回家啦！</div>`;
  await wait(700);
  if (!G || G.tk !== tk) return;
  await hop(L.cx, L.rowY - L.S * 0.06);
  if (!G || G.tk !== tk) return;
  SFX.win(); confetti(); splashAt(L.cx, L.rowY);
  say('过河啦！你真棒！');
  const stk = awardSticker();
  await wait(1100);
  if (!G || G.tk !== tk) return;
  showWin(stk);
}
function awardSticker() {
  const left = STICKERS.filter(s => !store.stickers.includes(s));
  if (!left.length) return null;
  const s = pick(left);
  store.stickers.push(s); save();
  return s;
}
function showWin(stk) {
  const n = G.stars, stars = n >= 7 ? 3 : n >= 5 ? 2 : 1;
  $('#wStars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? 'on' : 'off'}" style="animation-delay:${(0.15 + i * 0.18).toFixed(2)}s">${STAR}</span>`).join('');
  $('#wSub').textContent = `一次就读对 ${n} / ${ROUND} 个`;
  $('#wStk').hidden = !stk;
  $('#wStkE').textContent = stk || '';
  $('#wChips').innerHTML = G.learned.map((it, i) =>
    `<button type="button" class="chip" data-i="${i}"><b class="${it.c.length > 1 ? 'two' : ''}">${it.c}</b><i>${it.p}</i></button>`).join('');
  $('#win').hidden = false;
}
$('#wChips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c && G) sayFull(G.learned[+c.dataset.i]); });
$('#againBtn').addEventListener('click', () => { if (G) startDeck(G.deck.id); });
$('#homeBtn').addEventListener('click', quit);
$('#quitBtn').addEventListener('click', quit);
function quit() {
  token++; G = null;
  releaseWake();
  try { speechSynthesis.cancel(); } catch (e) {}
  $('#win').hidden = true;
  game.hidden = true;
  $('#home').hidden = false;
  document.body.classList.remove('playing');
  renderHome();
}

// 安卓 App 的返回键：过河中 / 结算 → 回首页；首页收起家长设置；再按就退出
window.hanziApp = {
  back() {
    if (G || !$('#win').hidden) { quit(); return true; }
    const p = $('#parent');
    if (p.open) { p.open = false; return true; }
    return false;
  },
  pause() { try { speechSynthesis.cancel(); } catch (e) {} }
};

function renderSteps() {
  $('#steps').innerHTML = Array.from({ length: ROUND }, (_, i) =>
    `<span class="step${i < G.idx ? ' done' : i === G.idx ? ' now' : ''}"></span>`).join('');
}
function splashAt(x, y) {
  const r = document.createElement('div');
  r.className = 'splash';
  const s = L.S * 1.1;
  Object.assign(r.style, { left: (x - s / 2) + 'px', top: (y - s / 2) + 'px', width: s + 'px', height: s + 'px' });
  world.appendChild(r);
  setTimeout(() => r.remove(), 750);
}
function plusStar(x, y) {
  const p = document.createElement('div');
  p.className = 'plus';
  p.innerHTML = STAR + '+1';
  p.style.left = x + 'px'; p.style.top = y + 'px';
  stage.appendChild(p);
  setTimeout(() => p.remove(), 1250);
  const sc = $('#score');
  if (sc.animate) sc.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.22)' }, { transform: 'scale(1)' }], { duration: 420, delay: 500 });
}
function confetti() {
  if (reduced) return;
  const fx = $('#fx'), cols = ['#ff6f9f', '#ffc93c', '#ffffff', '#9be07c', '#ffb8d0'];
  for (let i = 0; i < 44; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = pick(cols);
    p.style.setProperty('--d', (1.8 + Math.random() * 1.6).toFixed(2) + 's');
    p.style.setProperty('--dx', ((Math.random() - 0.5) * 160).toFixed(0) + 'px');
    p.style.setProperty('--rot', ((Math.random() - 0.5) * 900).toFixed(0) + 'deg');
    p.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    fx.appendChild(p);
    setTimeout(() => p.remove(), 4200);
  }
}
async function requestWake() {
  try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && G) requestWake(); });

let rz = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => {
    if (!G || game.hidden) return;
    layout();
    world.classList.add('still');
    if (G.base) place(G.base, L.cx, L.baseY);
    G.pads.forEach(p => place(p, slotX(+p.dataset.slot), slotY(+p.dataset.slot)));
    if (!G.busy) setFrog(L.cx, L.baseY);
    requestAnimationFrame(() => world.classList.remove('still'));
  });
});

function boot() { renderHome(); updateVoiceNote(); }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
})();
</script>
